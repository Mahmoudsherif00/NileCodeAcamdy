<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" fill="none">
  <defs>
    <linearGradient id="thHoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6BD0"/>
      <stop offset="1" stop-color="#0C3E85"/>
    </linearGradient>
    <linearGradient id="thSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9BE"/>
      <stop offset="1" stop-color="#E9AE87"/>
    </linearGradient>
    <linearGradient id="thPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13304F"/>
      <stop offset="1" stop-color="#0B1E38"/>
    </linearGradient>
    <radialGradient id="thGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#008CFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#008CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="thGlowF" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="380" cy="320" rx="300" ry="250" fill="url(#thGlow)"/>
  <ellipse cx="380" cy="588" rx="185" ry="26" fill="#020B18" opacity="0.55"/>

  <!-- crossed legs -->
  <g fill="url(#thPants)">
    <circle cx="262" cy="512" r="46"/>
    <circle cx="498" cy="512" r="46"/>
    <path d="M262 492 C300 470 460 470 498 492 L498 536 C450 556 310 556 262 536 Z"/>
  </g>
  <path d="M300 542 Q380 570 460 542" stroke="#00A8FF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>

  <!-- torso (hoodie) -->
  <path d="M318 356 C318 336 338 324 380 324 C422 324 442 336 442 356
           L456 492 C456 516 436 528 380 528 C324 528 304 516 304 492 Z"
        fill="url(#thHoodie)"/>
  <path d="M352 330 Q380 344 408 330" stroke="#0C3E85" stroke-width="10" stroke-linecap="round"/>
  <path d="M332 470 Q380 492 428 470" stroke="#083061" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- laptop (back facing viewer) -->
  <ellipse cx="380" cy="520" rx="80" ry="26" fill="#00D9FF" opacity="0.16" filter="url(#thGlowF)"/>
  <g filter="url(#thGlowF)">
    <rect x="326" y="444" width="108" height="84" rx="12" fill="#0B1E38" stroke="#1E5B9E" stroke-width="2"/>
    <circle cx="380" cy="486" r="16" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <path d="M372 486 L378 492 L390 478" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- arms -->
  <path d="M320 380 C300 420 310 452 336 470" stroke="url(#thHoodie)" stroke-width="26" stroke-linecap="round"/>
  <path d="M440 380 C460 420 450 452 424 470" stroke="url(#thHoodie)" stroke-width="26" stroke-linecap="round"/>
  <circle cx="338" cy="474" r="12" fill="url(#thSkin)"/>
  <circle cx="422" cy="474" r="12" fill="url(#thSkin)"/>

  <!-- head -->
  <circle cx="380" cy="262" r="64" fill="url(#thSkin)"/>
  <circle cx="316" cy="272" r="12" fill="url(#thSkin)"/>
  <circle cx="444" cy="272" r="12" fill="url(#thSkin)"/>

  <!-- hair -->
  <path d="M316 262 C316 214 342 194 380 194 C418 194 444 214 444 262
           C444 240 428 226 414 232 C420 220 412 210 400 212 C396 200 380 196 368 204
           C350 196 330 210 330 226 C322 228 316 240 316 262 Z" fill="#182B45"/>
  <path d="M336 216 C352 204 408 204 424 216" stroke="#0F1D30" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- face -->
  <path d="M354 250 Q362 244 372 248" stroke="#182B45" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M388 248 Q398 244 406 250" stroke="#182B45" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="362" cy="264" r="5" fill="#182B45"/>
  <circle cx="398" cy="264" r="5" fill="#182B45"/>
  <path d="M366 290 Q380 302 394 290" stroke="#B26B4A" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="344" cy="282" rx="10" ry="6" fill="#FF8F6B" opacity="0.3"/>
  <ellipse cx="416" cy="282" rx="10" ry="6" fill="#FF8F6B" opacity="0.3"/>

  <!-- headphones -->
  <path d="M310 254 C310 196 346 172 380 172 C414 172 450 196 450 254"
        stroke="#123258" stroke-width="13" stroke-linecap="round"/>
  <g filter="url(#thGlowF)">
    <rect x="294" y="244" width="30" height="46" rx="14" fill="#123258"/>
    <rect x="436" y="244" width="30" height="46" rx="14" fill="#123258"/>
    <circle cx="309" cy="267" r="8" fill="#00D9FF"/>
    <circle cx="451" cy="267" r="8" fill="#00D9FF"/>
  </g>

  <!-- floating icon bubbles -->
  <g filter="url(#thGlowF)">
    <circle cx="170" cy="180" r="38" fill="#0B2140" fill-opacity="0.85" stroke="#00A8FF" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M170 160 C160 160 154 168 154 176 C154 182 158 186 162 189 L162 196 L178 196 L178 189 C182 186 186 182 186 176 C186 168 180 160 170 160 Z"
          fill="none" stroke="#00D9FF" stroke-width="3"/>
    <line x1="165" y1="201" x2="175" y2="201" stroke="#00D9FF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g filter="url(#thGlowF)">
    <circle cx="592" cy="158" r="34" fill="#0B2140" fill-opacity="0.85" stroke="#00A8FF" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="578" y="144" width="28" height="28" rx="7" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <rect x="587" y="153" width="10" height="10" rx="2.5" fill="#00D9FF"/>
  </g>
  <g filter="url(#thGlowF)">
    <circle cx="140" cy="356" r="30" fill="#0B2140" fill-opacity="0.85" stroke="#00A8FF" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M132 344 L156 356 L132 368 Z" fill="#00D9FF"/>
  </g>
  <g filter="url(#thGlowF)">
    <circle cx="616" cy="366" r="32" fill="#0B2140" fill-opacity="0.85" stroke="#00A8FF" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="602" y="356" width="28" height="22" rx="7" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <circle cx="611" cy="366" r="3" fill="#00D9FF"/>
    <circle cx="621" cy="366" r="3" fill="#00D9FF"/>
  </g>
  <g stroke="#00A8FF" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7">
    <path d="M208 196 C260 230 290 250 318 262"/>
    <path d="M558 172 C510 210 480 236 446 252"/>
  </g>

  <!-- particles -->
  <circle cx="96" cy="270" r="3" fill="#00D9FF" opacity="0.6"/>
  <circle cx="664" cy="250" r="2.5" fill="#7FE9FF" opacity="0.55"/>
  <circle cx="250" cy="110" r="2" fill="#00A8FF" opacity="0.5"/>
  <circle cx="530" cy="96" r="2.5" fill="#00D9FF" opacity="0.45"/>
  <circle cx="680" cy="470" r="3" fill="#00A8FF" opacity="0.4"/>
  <circle cx="80" cy="480" r="2.5" fill="#00D9FF" opacity="0.4"/>
</svg>
