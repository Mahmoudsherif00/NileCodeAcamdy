<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none">
  <defs>
    <linearGradient id="bfcBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16375F"/>
      <stop offset="1" stop-color="#0A2140"/>
    </linearGradient>
    <linearGradient id="bfcEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A8FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="bfcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#008CFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#008CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="bfcGlowF" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="320" cy="300" rx="250" ry="200" fill="url(#bfcGlow)"/>

  <!-- holographic chart behind -->
  <g opacity="0.55" filter="url(#bfcGlowF)">
    <path d="M150 250 L200 210 L250 226 L300 176 L350 196 L420 150"
          stroke="#00D9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
    <rect x="150" y="258" width="16" height="26" rx="4" fill="#00A8FF" opacity="0.5"/>
    <rect x="176" y="246" width="16" height="38" rx="4" fill="#00A8FF" opacity="0.6"/>
    <rect x="202" y="238" width="16" height="46" rx="4" fill="#00D9FF" opacity="0.6"/>
  </g>

  <!-- handle -->
  <path d="M258 208 C258 168 282 148 320 148 C358 148 382 168 382 208"
        stroke="url(#bfcEdge)" stroke-width="13" stroke-linecap="round"/>
  <path d="M258 208 C258 168 282 148 320 148 C358 148 382 168 382 208"
        stroke="#0A2140" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- body -->
  <g filter="url(#bfcGlowF)">
    <rect x="140" y="204" width="360" height="240" rx="30" fill="url(#bfcBody)"
          stroke="url(#bfcEdge)" stroke-width="2.5"/>
    <path d="M140 320 L500 320" stroke="#00A8FF" stroke-opacity="0.5" stroke-width="2"/>
    <!-- clasp -->
    <rect x="292" y="298" width="56" height="44" rx="10" fill="#0E3158" stroke="#00A8FF" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="320" cy="320" r="7" fill="#00D9FF"/>
    <!-- corner accents -->
    <path d="M168 236 L168 218 C168 210 174 204 182 204 L200 204" stroke="#00D9FF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <path d="M472 412 L472 430 C472 438 466 444 458 444 L440 444" stroke="#00D9FF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <!-- sheen -->
    <path d="M170 224 C240 212 400 212 470 224 L470 250 C400 238 240 238 170 250 Z" fill="#7FE9FF" opacity="0.08"/>
  </g>

  <ellipse cx="320" cy="480" rx="200" ry="20" fill="#020B18" opacity="0.5"/>

  <!-- particles -->
  <circle cx="110" cy="140" r="3" fill="#00D9FF" opacity="0.6"/>
  <circle cx="530" cy="120" r="2.5" fill="#7FE9FF" opacity="0.55"/>
  <circle cx="560" cy="300" r="2" fill="#00A8FF" opacity="0.5"/>
  <circle cx="90" cy="330" r="2.5" fill="#00A8FF" opacity="0.4"/>
</svg>
